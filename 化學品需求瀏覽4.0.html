<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>化學品需求瀏覽</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2733;--mu:#6b7785;--bd:#dfe3e8;--ac:#1f4e78;--ac2:#e3eef8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--tx:#e6eaee;--mu:#97a3b0;--bd:#323b45;--ac:#7fb4e6;--ac2:#243445;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232a;--tx:#e6eaee;--mu:#97a3b0;--bd:#323b45;--ac:#7fb4e6;--ac2:#243445;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button,.bay{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 14px}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;min-width:110px}
.act{display:flex;gap:6px;align-items:flex-end}.act button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:5px 12px}.act button:disabled{opacity:.4;cursor:default}
.ms{position:relative;min-width:130px}.ms summary{cursor:pointer;list-style:none;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}.ms summary::after{content:' ▾';color:var(--mu)}.mo{position:absolute;z-index:5;top:100%;left:0;margin-top:2px;min-width:100%;max-height:260px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px 0;box-shadow:0 4px 14px rgba(0,0,0,.18)}.mo label{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--tx);padding:3px 10px;cursor:pointer;white-space:nowrap}.mo label:hover{background:var(--ac2)}.mo input{min-width:0}
.sum{color:var(--mu);margin:0 0 10px}
.g{display:grid;grid-template-columns:260px 1fr;gap:12px}
@media(max-width:760px){.g{grid-template-columns:1fr}}
.p{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.p h2{font-size:13px;margin:0;padding:8px 12px;border-bottom:1px solid var(--bd);color:var(--mu)}
.sc{max-height:560px;overflow:auto}
.bay{box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0}
.fold{cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}.fold b{color:var(--ac)}
.bt{cursor:pointer;position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--ac2);color:var(--ac);border-bottom:1px solid var(--bd);font-weight:600}
.bd{padding:4px 12px 8px 28px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:13px}.bd>div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.only{font:inherit;font-size:12px;cursor:pointer;margin-top:6px;border:1px solid var(--bd);background:var(--card);color:var(--ac);border-radius:6px;padding:3px 10px}.bay span{min-width:0}
.bay.on{background:var(--ac2);color:var(--ac)}.bay small{color:var(--mu);margin-left:6px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 12px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:var(--card);color:var(--mu);font-weight:600}
tr.c{cursor:pointer}tr.c:hover{background:var(--ac2)}tr.bh td{background:var(--ac2);color:var(--ac);font-weight:600}tr.bh small{color:var(--mu);font-weight:400}tr.cp td{font-size:12px;padding-top:2px;padding-bottom:2px}tr.d small{color:var(--mu)}tr.d td{background:var(--bg);color:var(--mu);font-size:13px}
.em{padding:20px;color:var(--mu);text-align:center}
</style></head><body><div class="w">
<h1>化學品需求瀏覽</h1>
<div class="tabs" id="tabs"></div>

<label>Bay ID<details class="ms" id="bay"><summary>全部</summary><div class="mo"></div></details></label>
<label>搜尋化學品<input id="q" placeholder="例如 HF"></label>
<label>搜尋 MiCAP_NO<input id="mic" placeholder="例如 2680727"></label>
<div class="act"><button id="undo" disabled>↩ 上一步</button><button id="reset">重置</button></div>
</div>
<p class="sum" id="sum"></p>

const def=()=>({ds:'POU',loc:[],fl:[],bay:[],q:'',mic:'',open:-1,ob:[],tb:false,pc:false});
let S=def(),hist=[],committed=JSON.stringify(S);
const fmt=v=>v.toLocaleString('en-US',{maximumFractionDigits:3});
const uniq=a=>[...new Set(a)].sort();
const KEY={loc:0,fl:1,bay:2},inS=(arr,v)=>!arr.length||arr.includes(v);
function ms(id,vals,sel){const el=$(id);el.querySelector('summary').textContent=sel.length?(sel.length<=2?sel.join('、'):sel.length+' 項已選'):'全部';
el.querySelector('.mo').innerHTML='<label><input type="checkbox" data-all'+(sel.length?'':' checked')+'>全部</label>'+vals.map(v=>`<label><input type="checkbox" value="${v}"${sel.includes(v)?' checked':''}>${v}</label>`).join('');}
function commit(){const j=JSON.stringify(S);if(j!==committed){hist.push(committed);committed=j;}$('undo').disabled=!hist.length;}
function sync(){const d=DATA[S.ds].rows;
[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k===S.ds));
ms('loc',uniq(d.map(r=>r[0])),S.loc);
const d1=d.filter(r=>inS(S.loc,r[0]));S.fl=S.fl.filter(x=>d1.some(r=>r[1]===x));ms('fl',uniq(d1.map(r=>r[1])),S.fl);
const d2=d1.filter(r=>inS(S.fl,r[1]));const bv=uniq([...d2.map(r=>r[2]),...d.filter(r=>r[2]==='-').map(r=>r[2])]);S.bay=S.bay.filter(x=>bv.includes(x));ms('bay',bv,S.bay);
$('q').value=S.q;$('mic').value=S.mic;$('undo').disabled=!hist.length;render();}
function render(){const C=DATA[S.ds].chems,M=DATA[S.ds].m,q=S.q.trim().toLowerCase(),mq=S.mic.trim().toLowerCase();
const ok=m=>(m[2]==='-'||(inS(S.loc,m[0])&&inS(S.fl,m[1])))&&inS(S.bay,m[2])&&(!mq||String(m[3]).toLowerCase().includes(mq));
const kk=n=>C[n].replace(/^[\d.]+%?/,'').toLowerCase(),cmp=(a,b)=>kk(a).localeCompare(kk(b))||C[a].localeCompare(C[b]);
const bays={},t={},ent={},mach=new Set();
Object.keys(M).forEach(i=>M[i].forEach(m=>{if(!ok(m)||(q&&!C[i].toLowerCase().includes(q)))return;const k=m[0]+'|'+m[1]+'|'+m[2];(bays[k]=bays[k]||{l:m[0],f:m[1],b:m[2],c:new Set(),s:0,ch:{}}).c.add(i);t[i]=(t[i]||0)+m[4];bays[k].s+=m[4];bays[k].ch[i]=(bays[k].ch[i]||0)+m[4];(ent[i]=ent[i]||[]).push(m);if(m[3]!=='-')mach.add(m[3]);}));
const bl=Object.values(bays).sort((x,y)=>(x.l+x.f+x.b).localeCompare(y.l+y.f+y.b));
$('sum').textContent=`符合條件：${bl.length} 個 Bay、${mach.size} 台機台（MiCAP_NO）`;
const tot=bl.reduce((x,r)=>x+r.s,0);$('bh').innerHTML=`<span>${S.pc?'▸':'▾'} Bay 清單${S.pc?'':'（點選展開／收合，右側為該 Bay 的化學合計點數）'}</span>${S.pc?`<b>${bl.length} 個 Bay · ${fmt(tot)}</b>`:''}`;$('bays').style.display=S.pc?'none':'';
const agg={};bl.forEach(r=>Object.keys(r.ch).forEach(i=>agg[i]=(agg[i]||0)+r.ch[i]));
$('bays').innerHTML=(bl.length?`<div class="bt" data-tot="1"><span>${S.tb?'▾':'▸'} 所選 Bay 化學總和（${bl.length} 個 Bay）</span><b>${fmt(bl.reduce((x,r)=>x+r.s,0))}</b></div>`+(S.tb?`<div class="bd">${Object.keys(agg).map(Number).sort(cmp).map(i=>`<div><span>${C[i]}</span><span>${fmt(agg[i])}</span></div>`).join('')}</div>`:''):'')+bl.map(r=>{const k=r.l+'|'+r.f+'|'+r.b,o=S.ob.includes(k);
return `<div class="bay${S.bay.length===1&&S.bay[0]===r.b&&S.loc.length===1&&S.loc[0]===r.l?' on':''}" data-k="${k}"><span>${o?'▾':'▸'} ${r.b}<small>${r.l} · ${r.f} · ${r.c.size} 種</small></span><b>${fmt(r.s)}</b></div>`+(o?`<div class="bd">${Object.keys(r.ch).map(Number).sort(cmp).map(i=>`<div><span>${C[i]}</span><span>${fmt(r.ch[i])}</span></div>`).join('')}<button class="only" data-l="${r.l}" data-f="${r.f}" data-b="${r.b}">只看此 Bay</button></div>`:'');}).join('')||'<div class="em">沒有符合的 Bay</div>';
const ks=Object.keys(t).map(Number).filter(i=>!q||C[i].toLowerCase().includes(q)).sort(cmp);
let h='<table><tr><th>化學品</th><th>合計點數</th></tr>';
ks.forEach(i=>{h+=`<tr class="c" data-i="${i}"><td>${C[i]}</td><td>${fmt(t[i])}</td></tr>`;
if(S.open===i){const g={};ent[i].forEach(m=>{const k=m[0]+'|'+m[1]+'|'+m[2];(g[k]=g[k]||[]).push(m);});
Object.keys(g).sort().forEach(k=>{const a=g[k],sm=a.reduce((x,m)=>x+m[4],0);h+=`<tr class="bh"><td>Bay ${a[0][2]}　<small>${a[0][0]} · ${a[0][1]}</small></td><td>${fmt(sm)}</td></tr>`;
a.sort((x,y)=>String(x[3]).localeCompare(String(y[3]))).forEach(m=>{h+=`<tr class="d"><td>　MiCAP_NO：${m[3]}${m[5]?' · '+m[5]:''}</td><td>${fmt(m[4])}</td></tr>`;});});}});
$('chem').innerHTML=ks.length?h+'</table>':'<div class="em">沒有符合的化學品需求</div>';}
$('tabs').innerHTML=Object.keys(DATA).map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('tabs').onclick=e=>{const k=e.target.dataset.k;if(!k||k===S.ds)return;S={...def(),ds:k};commit();sync();};
['loc','fl','bay'].forEach(id=>$(id).onchange=e=>{const t=e.target;if(t.type!=='checkbox')return;
if(t.hasAttribute('data-all'))S[id]=[];else S[id]=[...$(id).querySelectorAll('input[value]:checked')].map(x=>x.value);
S.open=-1;commit();sync();});
document.addEventListener('click',e=>document.querySelectorAll('.ms[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;}));
$('q').oninput=()=>{S.q=$('q').value;render();};$('q').onchange=commit;
$('mic').oninput=()=>{S.mic=$('mic').value;render();};$('mic').onchange=commit;
$('bh').onclick=()=>{S.pc=!S.pc;render();};
$('bays').onclick=e=>{if(e.target.closest('.bt')){S.tb=!S.tb;render();return;}
const o=e.target.closest('.only');if(o){S.loc=[o.dataset.l];S.fl=[o.dataset.f];S.bay=[o.dataset.b];commit();sync();return;}
const b=e.target.closest('.bay');if(!b)return;const k=b.dataset.k;S.ob=S.ob.includes(k)?S.ob.filter(x=>x!==k):[...S.ob,k];render();};
$('chem').onclick=e=>{const r=e.target.closest('tr.c');if(!r)return;const i=+r.dataset.i;S.open=S.open===i?-1:i;commit();render();};
$('undo').onclick=()=>{if(!hist.length)return;committed=hist.pop();S=JSON.parse(committed);sync();};
$('reset').onclick=()=>{S={...def(),ds:S.ds};commit();sync();};
sync();
</script></body></html>
